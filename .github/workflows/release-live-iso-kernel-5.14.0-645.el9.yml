name: Release CentOS Stream 9 Live ISO (kernel 5.14.0-645.el9)

on:
  push:
    tags:
      - "v*-kernel-5.14.0-645.el9"

permissions:
  contents: write

concurrency:
  group: release-live-iso-kernel-5.14.0-645-el9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pinned-kernel-live-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show release context
        run: |
          echo "Tag:        ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"
          echo "Repository: ${GITHUB_REPOSITORY}"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h

      - name: Build pinned-kernel ISO
        run: bash ./live-iso-5.14.0-645.el9/build.sh

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          out="live-iso-5.14.0-645.el9/out"
          trigger_tag="${GITHUB_REF_NAME}"
          kernel_suffix="-kernel-5.14.0-645.el9"
          release_tag="${trigger_tag%${kernel_suffix}}"

          if [[ "${release_tag}" == "${trigger_tag}" || -z "${release_tag}" ]]; then
            echo "ERROR: Could not derive release tag from trigger tag ${trigger_tag}" >&2
            exit 1
          fi

          echo "Trigger tag: ${trigger_tag}"
          echo "Release tag: ${release_tag}"

          mapfile -t isos < <(
            find "${out}" -maxdepth 1 -type f -name '*.iso' -print | sort
          )
          if (( ${#isos[@]} != 1 )); then
            echo "Expected exactly one ISO, found ${#isos[@]}." >&2
            exit 1
          fi

          mapfile -t manifests < <(
            find "${out}" -maxdepth 1 -type f -name '*.packages' -print | sort
          )
          if (( ${#manifests[@]} != 1 )); then
            echo "Expected exactly one package manifest, found ${#manifests[@]}." >&2
            exit 1
          fi

          release_base="centos-stream-9-kernel-5.14.0-645.el9-rpm-builder-live-${release_tag}-x86_64"
          iso_path="${out}/${release_base}.iso"
          packages_path="${out}/${release_base}.packages"

          mv "${isos[0]}" "${iso_path}"
          cp "${manifests[0]}" "${packages_path}"

          (
            cd "${out}"
            sha256sum "$(basename "${iso_path}")" > SHA256SUMS
          )

          {
            echo
            echo "GitHub trigger tag: ${trigger_tag}"
            echo "GitHub release tag: ${release_tag}"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Repository commit: ${GITHUB_SHA}"
          } >> "${out}/BUILD_INFO.txt"

          echo "iso=${iso_path}" >> "${GITHUB_OUTPUT}"
          echo "packages=${packages_path}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

          echo "Release assets:"
          ls -lh "${out}"
          cat "${out}/KERNEL_PIN_VERIFIED.txt"
          cat "${out}/SHA256SUMS"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          trigger_tag="${GITHUB_REF_NAME}"
          release_tag="${{ steps.assets.outputs.release_tag }}"
          out="live-iso-5.14.0-645.el9/out"
          assets=(
            "${{ steps.assets.outputs.iso }}"
            "${{ steps.assets.outputs.packages }}"
            "${out}/SHA256SUMS"
            "${out}/KERNEL_RPM_SHA256SUMS"
            "${out}/PINNED_KERNEL_RPMS.txt"
            "${out}/KOJI_BUILD_INFO.txt"
            "${out}/KERNEL_PIN_VERIFIED.txt"
            "${out}/UPSTREAM_COMMIT.txt"
            "${out}/BUILD_INFO.txt"
          )

          # The long tag selects the pinned-kernel build, while the shorter tag
          # is the public GitHub Release version. Never attach build artifacts
          # to a short tag that already points at a different commit.
          git fetch --force --tags origin

          release_tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            release_tag_exists=true
            existing_sha="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "ERROR: Release tag ${release_tag} already points to ${existing_sha}" >&2
              echo "but trigger tag ${trigger_tag} points to ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; replacing release assets."
            gh release upload "${release_tag}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            args=(
              release create "${release_tag}"
              "${assets[@]}"
              --repo "${GITHUB_REPOSITORY}"
              --title "${release_tag}"
              --generate-notes
            )

            if [[ "${release_tag_exists}" == true ]]; then
              args+=(--verify-tag)
            else
              args+=(--target "${GITHUB_SHA}")
            fi

            if [[ "${release_tag}" == *-* ]]; then
              args+=(--prerelease)
            fi

            gh "${args[@]}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: centos-stream-9-kernel-5.14.0-645.el9-${{ github.ref_name }}
          path: |
            ${{ steps.assets.outputs.iso }}
            ${{ steps.assets.outputs.packages }}
            live-iso-5.14.0-645.el9/out/SHA256SUMS
            live-iso-5.14.0-645.el9/out/KERNEL_RPM_SHA256SUMS
            live-iso-5.14.0-645.el9/out/PINNED_KERNEL_RPMS.txt
            live-iso-5.14.0-645.el9/out/KOJI_BUILD_INFO.txt
            live-iso-5.14.0-645.el9/out/KERNEL_PIN_VERIFIED.txt
            live-iso-5.14.0-645.el9/out/UPSTREAM_COMMIT.txt
            live-iso-5.14.0-645.el9/out/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
